# Which optional subsystems this repository uses.
#
# This repo started from claude_template_repo but is detached from template
# sync; this file is repo-owned. Turning a subsystem off makes
# `scripts/validate-template.sh` stop requiring its files and makes the
# devcontainer skip installing it.
#
# Format: shell `key=value`, sourced by scripts/lib/subsystems.sh. Values are
# `true` or `false`. Everything defaults to `true`.
#
# Turning a subsystem OFF does not delete anything. It only stops the
# validator from requiring it. Delete the files yourself once the switch is
# off. Routing and BMAD were removed outright — see docs/PROJECT.md.

# GitHub Project board workflow: /next-issue, /run-epic, board.sh.
# Files: scripts/board.sh, scripts/bootstrap-project.sh,
#        docs/KANBAN_WORKFLOW.md,
#        .claude/commands/{next-issue,run-epic}.md,
#        .github/ISSUE_TEMPLATE/{epic,user-story}.yml
SUBSYSTEM_BOARD=true

# Caveman response-style plugin.
# Files: scripts/install-caveman.sh
SUBSYSTEM_CAVEMAN=true

# Day-0 provisioning: repo settings, rulesets, board creation, CODEOWNERS fill.
# Mostly one-shot; safe to turn off once .ai/bootstrap-completed exists and you
# do not expect to re-provision.
# Files: scripts/setup-day0.sh, scripts/check-day0.sh,
#        scripts/bootstrap-github-settings.sh, scripts/bootstrap-project.sh,
#        .claude/commands/day0-check.md
SUBSYSTEM_DAY0=true
