---
# Default state for all rules
default: true

# MD003/heading-style/header-style - Heading style
MD003:
  # Enforce plain ATX headers (`# Heading`). The inherited cisagov skeleton
  # asked for atx_closed (`# Heading #`), which no document in this repository
  # has ever used -- every markdown file failed the rule, so any doc edit was
  # unlandable until the rule matched reality.
  style: atx

# MD004/ul-style - Unordered list style
MD004:
  # Enforce dashes for unordered lists
  style: dash

# MD013/line-length - Line length
MD013:
  # Do not enforce for code blocks
  code_blocks: false
  # Do not enforce for tables
  tables: false

# MD024/no-duplicate-heading/no-duplicate-header - Multiple headings with the
# same content
MD024:
  # Allow headers with the same content as long as they are not in the same
  # parent heading
  allow_different_nesting: true

# MD029/ol-prefix - Ordered list item prefix
MD029:
  # Enforce incrementing prefixes (`1.` `2.` `3.`), the style every document in
  # this repository already uses. The inherited skeleton asked for the all-`1.`
  # style, which nothing here follows.
  style: ordered

# MD033/no-inline-html - Inline HTML
MD033:
  # The div, h1 and img elements are allowed to permit header images
  allowed_elements:
    - div
    - h1
    - img

# MD035/hr-style - Horizontal rule style
MD035:
  # Enforce dashes for horizontal rules
  style: ---

# MD041/first-line-heading/first-line-h1 - First line in file should be a top
# level heading
MD041:
  # Allow content before first heading
  allow_preamble: true

# MD046/code-block-style - Code block style
MD046:
  # Enforce the fenced style for code blocks
  style: fenced

# MD049/emphasis-style - Emphasis style should be consistent
MD049:
  # Enforce asterisks as the style to use for emphasis
  style: asterisk

# MD050/strong-style - Strong style should be consistent
MD050:
  # Enforce asterisks as the style to use for strong
  style: asterisk

# MD060/table-column-style
MD060:
  # Allow tables to use different styles
  style: any
