---
# Template-owned files (claude_template_repo) are kept byte-identical to the
# upstream template so template-sync PRs stay clean — lint/format changes to
# them would surface as spurious reverts in every future sync. They are linted
# in the template repo itself. Project-owned files under scripts/ (ci/,
# setup-mcp.sh, test-instance.sh, mcp-health.sh) remain fully linted.
exclude: >
  (?x)^(
    \.claude/|
    \.devcontainer/|
    \.github/workflows/(ci|secret-scan|semgrep|container-scan|repository-audit|template-sync)\.yml$|
    \.github/ISSUE_TEMPLATE/(bug_report|epic|feature_request|security_vulnerability|user-story)\.yml$|
    \.github/pull_request_template\.md$|
    docs/(TEMPLATE_GUIDE|BMAD_WORKFLOW|KANBAN_WORKFLOW|AI_ROUTING_POLICY|README\.template)\.md$|
    scripts/(?!ci/|setup-mcp\.sh|test-instance\.sh|mcp-health\.sh).*|
    \.gitleaks\.toml$|
    \.templatesyncignore$|
    CLAUDE\.md$
  )

ci:
  # Do not commit changes from running pre-commit for pull requests.
  autofix_prs: false
  # Autoupdate hooks weekly (this is the default).
  autoupdate_schedule: weekly

default_language_version:
  # force all unspecified python hooks to run python3
  python: python3

repos:
  # Check the pre-commit configuration
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: pretty-format-json
        exclude: ^(package-lock\.json|\.vscode/settings\.json|.*/Pipfile\.lock)$
        args:
          - --autofix
      - id: trailing-whitespace

  # Text file hooks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args:
          - --config=.mdl_config.yaml
        # The copied Obsidian vault content under examples/vault-skeleton/ is
        # authored to Obsidian conventions (YAML `title:` + an H1 → MD025, tight
        # lists, wikilinks), not repo doc-lint rules; forcing markdownlint on it
        # would only degrade it as a vault. The skeleton's own README.md is a
        # real repo doc and stays linted.
        exclude: ^examples/vault-skeleton/(?!README\.md$).*
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.1
    hooks:
      - id: prettier
        # This is the latest version of v3 available from NPM. The pre-commit
        # mirror does not pull tags for old major versions once a new major
        # version tag is published.
        additional_dependencies:
          - prettier@3.3.1
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --strict

  # GitHub Actions hooks
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.0
    hooks:
      - id: check-github-actions
      - id: check-github-workflows

  # pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit
    rev: v4.5.1
    hooks:
      - id: validate_manifest

  # Shell script hooks
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.0-1
    hooks:
      - id: shfmt
        args:
          # List files that will be formatted
          - --list
          # Write result to file instead of stdout
          - --write
          # Indent by two spaces
          - --indent
          - "2"
          # Binary operators may start a line
          - --binary-next-line
          # Switch cases are indented
          - --case-indent
          # Redirect operators are followed by a space
          - --space-redirects
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args:
          - -x

  # Docker hooks
  - repo: https://github.com/IamTheFij/docker-pre-commit
    rev: v3.0.1
    hooks:
      - id: docker-compose-check

  # Security scanning hooks (from claude_template_repo foundation)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # gitleaks-system runs the sha256-pinned binary baked into the devcontainer
      # image (see GITLEAKS_VERSION in .devcontainer/Dockerfile — keep it in sync
      # with this rev). The default `gitleaks` hook is language: golang, which
      # builds from source and would need firewall egress to the Go toolchain
      # and module proxy. Entry already passes --redact --staged --verbose.
      # pass_filenames: false is set on the upstream golang hook but missing
      # from the system variant — without it pre-commit appends filenames as
      # positional args and gitleaks aborts ("accepts at most 1 arg(s)").
      # Outside the devcontainer (no gitleaks binary on PATH) skip with:
      #   SKIP=gitleaks-system git commit ...
      # CI still scans full history via .github/workflows/secret-scan.yml.
      - id: gitleaks-system
        args:
          - --config=.gitleaks.toml
        pass_filenames: false
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.83.0
    hooks:
      - id: semgrep
        args:
          - --config
          - .semgrep.yml
          - --error
          - --metrics=off
        # semgrep 1.83.0's opentelemetry dependency imports pkg_resources, which
        # setuptools removed in v81. Pin a compatible setuptools so the hook's venv
        # works on Python 3.12+ hosts (CI uses the semgrep Docker image, unaffected).
        additional_dependencies:
          - setuptools<81
