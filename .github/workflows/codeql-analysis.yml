---
# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
name: CodeQL

on: # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  pull_request:
    # The branches here must be a subset of the ones in the push key
    branches:
      - main
  push:
    # Dependabot-triggered push events have read-only access, but uploading code
    # scanning requires write access.
    branches-ignore:
      - dependabot/**
  schedule:
    - cron: 31 7 * * 2

permissions:
  actions: read
  contents: read

jobs:
  diagnostics:
    name: Run Diagnostics
    uses: felddy/reusable-workflows/.github/workflows/diagnostics.yml@76486c28caa391f5f9db4941fc555a20a6e084c8 # tag=v4.2.0
  analyze:
    name: Analyze
    # CodeQL result upload requires code scanning, which needs GitHub Advanced
    # Security on private repos; skip there. Runs again if the repo goes public.
    if: ${{ !github.event.repository.private }}
    needs:
      - diagnostics
    runs-on: ubuntu-latest
    permissions:
      # actions/checkout needs this to fetch code
      contents: read
      # required for all workflows
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Override automatic language detection by changing the below
        # list
        #
        # Supported options are actions, c-cpp, csharp, go,
        # java-kotlin, javascript-typescript, python, ruby, and swift.
        # In scope: workflows (actions), the content build tooling
        # (scripts/content/*.mjs), and the battlemap renderer
        # (scripts/maps/render_map.py). The upstream image-source toolchain was
        # removed with the root Dockerfile and the vendored mcp-server/ bundle
        # is gitignored, so neither is scanned.
        #
        # Keep this list in step with the tracked sources, and check `git
        # ls-files` on THIS branch's merge base rather than on the branch
        # itself. #66 dropped the python leg after the routing subsystem took
        # the last .py file, not noticing that #64 had landed
        # scripts/maps/render_map.py on main in the meantime; the leg was red
        # for the branch and correct for main. Both failure modes are silent
        # in opposite directions: a language with no source fails hard (exit
        # 32, "not any written in Python"), while a language with source and
        # no leg simply goes unscanned.
        #
        # Dropping a language that main has already analyzed also leaves a
        # stale code-scanning configuration, which makes the "CodeQL" gate
        # report "configurations not found" on every PR. When removing one,
        # delete its old analyses:
        #   gh api "repos/<owner>/<repo>/code-scanning/analyses?ref=refs/heads/main" \
        #     --jq '.[] | select(.category | endswith("language:<lang>")) | .id'
        language:
          - actions
          - javascript-typescript
          - python
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript',
        # 'python', 'ruby' ] Learn more about CodeQL language support at
        # https://git.io/codeql-language-support

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # tag=v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.github.com:443
            *.githubapp.com:443
            *.githubusercontent.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # tag=v4.37.7
        with:
          languages: ${{ matrix.language }}

      # Autobuild attempts to build any compiled languages (C/C++, C#, or
      # Java). If this step fails, then you should remove it and run the build
      # manually (see below).
      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # tag=v4.37.7

      # ℹ️ Command-line programs to run using the OS shell. 📚
      # https://git.io/JvXDl

      # ✏️ If the Autobuild fails above, remove it and uncomment the following
      #    three lines and modify them (or add more) to build your code if your
      #    project uses a compiled language

      # - run: |
      #     make bootstrap
      #     make release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # tag=v4.37.7
